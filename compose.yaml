name: zhiji
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zhiji
      POSTGRES_USER: zhiji
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行配置脚本}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["zhiji-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiji"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:6-alpine
    ports: ["127.0.0.1:63799:6379"]
    volumes: ["zhiji-redis:/data"]
    command: ["redis-server", "--appendonly", "yes"]
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: zhiji
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?请先运行配置脚本}
    ports: ["127.0.0.1:9009:9000", "127.0.0.1:9010:9001"]
    command: server /data --console-address :9001
    volumes: ["zhiji-minio:/data"]
volumes:
  zhiji-postgres:
  zhiji-redis:
  zhiji-minio:
