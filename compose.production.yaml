name: zhiji-production

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhiji
      POSTGRES_USER: zhiji
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 中设置 POSTGRES_PASSWORD}
    volumes:
      - zhiji-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiji -d zhiji"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - zhiji-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [backend]

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?请在 .env.production 中设置 MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?请在 .env.production 中设置 MINIO_PASSWORD}
    command: server /data
    volumes:
      - zhiji-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://zhiji:${POSTGRES_PASSWORD}@postgres:5432/zhiji
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_ACCOUNTS_ENABLED: ${DEMO_ACCOUNTS_ENABLED:-true}
      BOOTSTRAP_STUDENT_PASSWORD: ${BOOTSTRAP_STUDENT_PASSWORD:?请设置竞赛体验账号初始密码}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?请设置管理员初始密码}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - zhiji-factory:/app/data/factory
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 10s
      timeout: 7s
      retries: 30
      start_period: 30s
    networks: [frontend, backend]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?请在 .env.production 中设置 SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  zhiji-postgres:
  zhiji-redis:
  zhiji-minio:
  zhiji-factory:
  caddy-data:
  caddy-config:
